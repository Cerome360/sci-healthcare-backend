name: Auto-merge

# Merges a pull request as soon as every GitHub Actions check and the
# security scan (security.yml) have passed on its latest
# commit. Logic and tests: .github/scripts/automerge.cjs.
#
# Security: this workflow runs the copy of itself on the default branch, with
# a write token, and never checks out or executes code from the pull request.

on:
  workflow_run:
    workflows: [CI, Security scan]
    types: [completed]
  pull_request_target:
    # opened/synchronize: approve the CI run GitHub holds for first-time
    # contributors. edited: re-check as soon as a contributor links an issue.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  schedule:
    # Backstop only: GitHub drops many scheduled runs under load.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read
  actions: write

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    # Every run sweeps all open pull requests, so CI finishing anywhere
    # (including on main) is a reason to look again.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/github-script@v8
        env:
          # Pull requests that change these paths also need a maintainer
          # approval. CI runs with the workflow files from the pull request
          # itself, so editing them could make a pull request pass its own
          # checks. Everything else merges on green CI alone.
          SENSITIVE_PATHS: |
            .github/**
          REQUEST_PAGES_BUILD: 'false'
        with:
          # AUTOMERGE_TOKEN (optional) is a token allowed to write workflow
          # files. Without it, GitHub refuses to let the built-in token merge
          # a branch created before a workflow change on main, and its merges
          # do not trigger other workflows.
          github-token: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          script: |
            const run = require('./.github/scripts/automerge.cjs');
            await run({ github, context, core });
