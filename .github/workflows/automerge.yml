name: Auto-merge

# Merges a pull request as soon as every GitHub Actions check on its latest
# commit has passed. Logic and tests: .github/scripts/automerge.cjs.
#
# Security: this workflow runs the copy of itself on the default branch, with
# a write token, and never checks out or executes code from the pull request.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [labeled, unlabeled, ready_for_review, reopened]
  schedule:
    # Catches approvals and anything an event missed.
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read
  actions: write

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/github-script@v7
        env:
          # Changes to these paths also need a maintainer approval: they
          # control CI itself, deployment, or what code gets installed.
          SENSITIVE_PATHS: |
            .github/**
            scripts/**
            package.json
            package-lock.json
            .nvmrc
            render.yaml
            prisma/schema.prisma
            Dockerfile
            docker-compose*.yml
          REQUEST_PAGES_BUILD: 'false'
        with:
          script: |
            const run = require('./.github/scripts/automerge.cjs');
            await run({ github, context, core });
