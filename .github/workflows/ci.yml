name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the auto-merge bot run CI on main after it merges (merges made
  # with GITHUB_TOKEN do not trigger push workflows).
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck

  # The same suite runs on both engines. SQLite is what contributors get
  # with no setup; Postgres is what production runs, and the two disagree on
  # string ordering and comparison in ways that only show up with real data.
  test:
    name: test (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sqlite
            database-url: ''
          - engine: postgres
            database-url: 'postgresql://sci:sci@localhost:5432/sci_healthcare_test'
    # Started for both entries; the SQLite entry simply never connects. The
    # health gate keeps the Postgres entry from racing the container's boot.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sci
          POSTGRES_PASSWORD: sci
          POSTGRES_DB: sci_healthcare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: ${{ matrix.database-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Prisma cannot read the provider from the environment, so the schema
      # is switched before generating the client for Postgres.
      - if: matrix.engine == 'postgres'
        run: ./scripts/use-postgres.sh
      - run: npx prisma generate
      # Coverage report with the thresholds configured in vitest.config.ts:
      # the job prints the summary table and fails below them (issue #65).
      - run: npm run test:coverage

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: ./scripts/use-postgres.sh
      # A fresh database must migrate cleanly...
      - run: npx prisma migrate deploy
      # ...and end up exactly where the schema says. Exit code 2 means the
      # schema changed without a migration.
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

  # Fails the pull request on high and critical advisories in production
  # dependencies. Threshold: `--audit-level=high` — moderate findings are
  # printed in the job log but do not fail it. `--omit=dev` keeps the gate on
  # what actually ships; npm audit reads package-lock.json, so it checks
  # exactly the dependency set this CI builds.
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  # Alerting rules are configuration, so they are validated rather than
  # trusted: promtool is the parser Prometheus loads them with, and it fails
  # on a malformed expression, a bad duration or an unknown field. It runs
  # from the pinned Prometheus image so there is no download URL to rot.
  alerts:
    name: alerts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ops/alerts.yml
        run: |
          docker run --rm \
            -v "$PWD/ops:/ops:ro" \
            --entrypoint promtool \
            prom/prometheus:v3.1.0 check rules /ops/alerts.yml

  bot:
    name: auto-merge bot tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --test .github/scripts/automerge.test.cjs .github/scripts/security-scan.test.cjs
