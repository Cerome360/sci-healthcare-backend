# Render Blueprint for the SCI Healthcare indexer and API.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
# Everything below is provisioned together, so the only value you supply by
# hand is CORS_ORIGIN once the frontend URL exists.

databases:
  - name: sci-healthcare-db
    databaseName: sci_healthcare
    user: sci
    plan: free
    region: oregon

services:
  - type: web
    name: sci-healthcare-api
    runtime: node
    plan: free
    # Same region as the database so the internal connection string is used
    # and traffic never leaves Render's network.
    region: oregon
    branch: main
    buildCommand: npm ci && ./scripts/use-postgres.sh && npx prisma generate && npm run build
    # Schema changes ship as reviewed migrations in prisma/migrations and are
    # applied here. An existing database created by `db push` needs the
    # baseline marked as applied once; see README "Deploying".
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sci-healthcare-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "8080"
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: STELLAR_NETWORK
        value: testnet
      # A second endpoint keeps indexing alive through an RPC outage.
      # Comma-separated; SOROBAN_RPC_URL alone still works.
      - key: SOROBAN_RPC_URL
        value: https://soroban-testnet.stellar.org
      # - key: SOROBAN_RPC_URLS
      #   value: https://soroban-testnet.stellar.org,https://backup-rpc.example
      - key: NETWORK_PASSPHRASE
        value: "Test SDF Network ; September 2015"
      - key: REGISTRY_CONTRACT_ID
        value: CAMU635NRFEHATJ6MTY5SI43IAZ43KHPFXAQDQAST2AHKCHLSGWHVE4V
      - key: VOUCHER_CONTRACT_ID
        value: CBPUQN6CNJCNGPKNEXB7UM4T7RINKQB7HQI5CXEOSQ5EFRHE4G4VKPSQ
      - key: RECEIPT_CONTRACT_ID
        value: CBCJRI2BCZBMZNX77WWDC2NGSV4ZNAN5Q23XHYNBH6UTOQMPJHZGX5C7
      - key: USDC_CONTRACT_ID
        value: CCRLJ7FEIKTR3GBT3VQQPSIJGRBO2WPNMVFKJDP6AYGJQWECOR4QVE5M
      # Testnet demo faucet; counted in /stats when set.
      - key: FAUCET_CONTRACT_ID
        value: CCB25WG7DQ2CSNXPTOHZO2PDZ324FQPZLH3LSNCCLWYM3FEH52GEXC47
      # Ledger the contracts were deployed at. Leaving this at 0 would start
      # the indexer at the current tip and silently skip all prior history.
      - key: INDEXER_START_LEDGER
        value: "5063070"
      - key: INDEXER_POLL_MS
        value: "5000"
      # /ready reports degraded when the indexer trails by more than this.
      - key: READY_MAX_LAG_LEDGERS
        value: "120"
      # Set to the Vercel URL after the frontend is deployed.
      - key: CORS_ORIGIN
        sync: false

# ---------------------------------------------------------------------------
# Optional: run the API and the indexer as separate services.
#
# The service above runs both in one process, which suits the free plan (a
# background worker needs a paid instance type). To scale them
# independently, delete `sci-healthcare-api` and uncomment the two services
# below, duplicating its envVars block into each.
#
# - type: web
#   name: sci-healthcare-api
#   runtime: node
#   plan: free
#   region: oregon
#   branch: main
#   buildCommand: npm ci && ./scripts/use-postgres.sh && npx prisma generate && npm run build
#   # The API owns migrations so the worker only ever reads.
#   startCommand: npm run db:migrate && npm run start:api
#   healthCheckPath: /health
#   envVars: ["...same as sci-healthcare-api above..."]
#
# - type: worker
#   name: sci-healthcare-indexer
#   runtime: node
#   plan: starter
#   region: oregon
#   branch: main
#   buildCommand: npm ci && ./scripts/use-postgres.sh && npx prisma generate && npm run build
#   startCommand: npm run start:indexer
#   envVars: ["...same contract ids and indexer settings as above..."]

# ---------------------------------------------------------------------------
# Two-network deployment: serve testnet and mainnet from one codebase.
#
# Each network gets its own service + database pair. The backend validates at
# startup that NETWORK_PASSPHRASE matches STELLAR_NETWORK, so a misconfigured
# service refuses to start rather than serving the wrong chain.
#
# Example: duplicate the service above with different names and env vars.
#
# - type: web
#   name: sci-healthcare-testnet
#   runtime: node
#   plan: free
#   region: oregon
#   branch: main
#   buildCommand: npm ci && ./scripts/use-postgres.sh && npx prisma generate && npm run build
#   startCommand: npx prisma db push --skip-generate --accept-data-loss && npm start
