#       value: "Test SDF Network ; September 2015"
#     - key: REGISTRY_CONTRACT_ID
#       value: "<testnet registry contract id>"
#     - key: VOUCHER_CONTRACT_ID
#       value: "<testnet voucher contract id>"
#     - key: RECEIPT_CONTRACT_ID
#       value: "<testnet receipt contract id>"
#     - key: USDC_CONTRACT_ID
#       value: "<testnet USDC contract id>"
#     - key: INDEXER_START_LEDGER
#       value: "<ledger where testnet contracts were deployed>"
#     - key: CORS_ORIGIN
#       sync: false
#
# - type: database
#   name: sci-healthcare-testnet-db
#   databaseName: sci_healthcare_testnet
#   user: sci
